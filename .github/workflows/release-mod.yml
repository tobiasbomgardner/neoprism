name: Build and Release Mod

on:
  create:

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod jar
        run: ./gradlew --no-daemon clean build

      - name: Collect release files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" | sort)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No jar files found in build/libs"
            exit 1
          fi

          {
            echo "paths<<EOF"
            printf '%s\n' "${jars[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload jars
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.files.outputs.paths }}
